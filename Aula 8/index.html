<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <form id="formulario">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome... ">
        <br>
        <label for="sobrenome">Sobrenome: </label>
        <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome... ">
        <br>
        <label for="idade">Idade:</label>
        <input type="text" id="idade" name="idade" placeholder="Digite seu idade... ">
        <br>
        <label for="profissao">Profissão: </label>
        <input type="text" id="profissao" name="profissao" placeholder="Digite seu profissao... ">
        <br>
        <input type="submit" value="Cadastrar">
    </form>
    <p id="resposta"></p>
    
    <script src="script.js"></script>
</body>
</html>
